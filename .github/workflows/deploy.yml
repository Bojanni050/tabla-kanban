name: Deploy to VPS - Kala

# Deploys to the Strato/Plesk server over SSH on every push to main (or manually from the
# Actions tab). The server keeps a git checkout of this repository plus a local .env with the
# production secrets; this workflow only updates the code and rebuilds the containers.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST         server host name or IP
#   SSH_USER         SSH user that may run docker (same as for melodiq)
#   SSH_PRIVATE_KEY  private key for that user (the matching public key is in ~/.ssh/authorized_keys)
#   DEPLOY_PATH      folder of the checkout on the server, e.g. /var/www/vhosts/<domain>/kala
#
# Until these are set the workflow does nothing and finishes green.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy-kala
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check deployment configuration
        id: config
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "::notice::Deployment secrets are not configured (SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, DEPLOY_PATH) - skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        if: steps.config.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH
          command_timeout: 15m
          script: |
            set -e

            # A secret pasted into GitHub often carries a trailing space or newline: trim it.
            DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "ERROR: DEPLOY_PATH is not a git checkout on the server (logged in as: $(whoami))."
              echo "Check the DEPLOY_PATH secret, that the repository is cloned there, and that this user can read it."
              exit 1
            fi
            cd "$DEPLOY_PATH"

            # Update the code. The untracked .env with the production secrets is left alone.
            git fetch origin
            git reset --hard origin/main

            # 1. Build the new images (the running containers are not touched yet).
            docker compose build

            # 2. Apply pending database migrations with the NEW image BEFORE the new backend
            #    starts. If a migration fails, the deploy stops here and the old version keeps
            #    running. Migrations must stay backwards compatible (additive) so the old
            #    backend still works against the migrated schema during the switch.
            docker compose up -d --wait --wait-timeout 120 postgres
            if ! docker compose run --rm --no-deps backend ./node_modules/.bin/prisma migrate deploy; then
              echo "ERROR: database migration failed - the running version was left untouched."
              exit 1
            fi

            # 3. Start the new version. --wait blocks until every service is healthy and fails
            #    the deployment if one is not. The database volume is never touched. (The
            #    backend also runs `prisma migrate deploy` on start; that is a no-op now.)
            # On failure, print the service state and logs so the cause shows up in this run.
            if ! docker compose up -d --wait --wait-timeout 300; then
              echo "::group::docker compose ps"
              docker compose ps -a || true
              echo "::endgroup::"
              echo "::group::backend logs"
              docker compose logs --no-color --tail=100 backend || true
              echo "::endgroup::"
              exit 1
            fi

            docker image prune -f
            docker compose ps
