# nginx configuration for the Kala frontend container.
#
# The browser talks to a single origin:
#   /            -> static React build (single-page app, falls back to index.html)
#   /api/*       -> Express backend
#   /api/realtime-> Express backend, as a long-lived Server-Sent Events stream
#
# Kala's real-time channel is Server-Sent Events (EventSource), NOT WebSockets, so no
# Upgrade handling is needed - the stream only requires that nginx does not buffer or
# time out the response.

# Trust an X-Forwarded-Proto set by a TLS-terminating proxy in front of this container;
# otherwise report the scheme nginx itself received. The backend uses it for secure cookies.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend through Docker's embedded DNS at request time, so nginx still
    # starts (and keeps working) if the backend container is restarted or re-created.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:3001;

    client_max_body_size 2m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Liveness probe for this container (used by the compose health check).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Server-Sent Events -------------------------------------------------
    # One long-lived GET per open board. Must not be buffered, cached, compressed or
    # cut off by a proxy timeout. The backend sends a heartbeat comment every 25s.
    location = /api/realtime {
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        # nginx consumes the backend's X-Accel-Buffering header instead of passing it on.
        # Send it again so that any nginx in front of this container (e.g. Plesk's) also
        # streams the events instead of buffering them.
        add_header X-Accel-Buffering "no" always;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ---- REST API -----------------------------------------------------------
    location /api/ {
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_read_timeout 60s;
    }

    # ---- Static assets ------------------------------------------------------
    # Vite fingerprints everything under /assets, so it can be cached for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths (e.g. /invite/<token>) serve index.html.
    # index.html itself must always be revalidated so new deploys are picked up.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
